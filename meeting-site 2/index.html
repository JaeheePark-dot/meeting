<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재희·동희 회의록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed ledger rail on the left (navigation + who's writing), a working sheet on the right; every figure set in mono like a sales ledger */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --line:#D5DCD9; --line-strong:#B9C3BF;
  --ink:#15201C; --muted:#56635E; --faint:#85918C;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#D8ECE5;
  --jh:#4453C4; --jh-soft:#E2E5FA; --dh:#B9620E; --dh-soft:#FAEAD8; --team:#0E6B5A; --team-soft:#D8ECE5;
  --good:#1D8548; --good-soft:#DCF0E3; --ok:#0E6B5A; --warn:#A86F12; --warn-soft:#F7EBCF; --bad:#BE3D36; --bad-soft:#F6DDDB;
  --heat0:#E8ECEA; --heat1:#CDE5DC; --heat2:#9CCDBC; --heat3:#4FA488; --heat4:#16745D; --heat-hi:#FFFFFF;
  --shadow:0 1px 2px rgba(21,32,28,.06), 0 4px 16px rgba(21,32,28,.06);
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211F; --sunk:#212B28; --line:#2D3935; --line-strong:#3E4C47;
  --ink:#E4EBE8; --muted:#A1AEA9; --faint:#74817C;
  --accent:#3DB597; --accent-ink:#06211A; --accent-soft:#163A31;
  --jh:#8E99F0; --jh-soft:#262B52; --dh:#EFA35B; --dh-soft:#43301B; --team:#3DB597; --team-soft:#163A31;
  --good:#4BC27E; --good-soft:#163724; --ok:#3DB597; --warn:#DDAE4E; --warn-soft:#3A2F16; --bad:#EE7A71; --bad-soft:#42201D;
  --heat0:#212B28; --heat1:#1C3B33; --heat2:#215D4D; --heat3:#2C876C; --heat4:#45BE99; --heat-hi:#06211A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211F; --sunk:#212B28; --line:#2D3935; --line-strong:#3E4C47;
  --ink:#E4EBE8; --muted:#A1AEA9; --faint:#74817C;
  --accent:#3DB597; --accent-ink:#06211A; --accent-soft:#163A31;
  --jh:#8E99F0; --jh-soft:#262B52; --dh:#EFA35B; --dh-soft:#43301B; --team:#3DB597; --team-soft:#163A31;
  --good:#4BC27E; --good-soft:#163724; --ok:#3DB597; --warn:#DDAE4E; --warn-soft:#3A2F16; --bad:#EE7A71; --bad-soft:#42201D;
  --heat0:#212B28; --heat1:#1C3B33; --heat2:#215D4D; --heat3:#2C876C; --heat4:#45BE99; --heat-hi:#06211A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:20px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:none;text-align:left;font-weight:500;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button small{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r)}
.who .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who div{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.who small{color:var(--muted);font-size:12px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--good)}
.sync.off i{background:var(--bad)}

.main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:13px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pnav{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.icon{width:34px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{margin:0;font-size:15px;font-weight:600}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.cols{display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.lbl{font-size:12px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}

.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap}
.c-jaehee{background:var(--jh-soft);color:var(--jh)}
.c-donghee{background:var(--dh-soft);color:var(--dh)}
.c-team{background:var(--team-soft);color:var(--team)}
.dot.c-jaehee{background:var(--jh);color:var(--surface)}
.dot.c-donghee{background:var(--dh);color:var(--surface)}

.bar{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:48px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--faint)}
.bar.t-good i{background:var(--good)} .bar.t-ok i{background:var(--ok)} .bar.t-warn i{background:var(--warn)} .bar.t-bad i{background:var(--bad)}
.tx-good{color:var(--good)} .tx-ok{color:var(--ok)} .tx-warn{color:var(--warn)} .tx-bad{color:var(--bad)} .tx-none{color:var(--faint)}

/* summary strip */
.sum{display:grid;grid-template-columns:1.2fr repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sum>div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);min-width:0}
.sum>div:first-child{border-left:0}
.sum b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.sum .big{font-size:30px;line-height:1.1}

/* period cards on home */
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .top b{font-family:var(--f-mono);font-size:32px;font-weight:600;line-height:1}
.pcard dl{margin:0;display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.pcard dt{font-size:12px;color:var(--muted)} .pcard dd{margin:0;font-family:var(--f-mono);font-size:13px;text-align:right}
.pcard .link{align-self:flex-start}

/* tables */
.tw{overflow-x:auto;margin:0 -2px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th,.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.t thead th{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);border-bottom:1px solid var(--line)}
.t thead th:first-child{border-top-left-radius:6px} .t thead th:last-child{border-top-right-radius:6px}
.t tr.grp th{background:none;padding-top:14px;font-size:11.5px;letter-spacing:.06em;color:var(--accent);font-weight:700;border-bottom:1px solid var(--line-strong)}
.t td.r,.t th.r{text-align:right}
.t td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.t .kname{font-weight:600} .t .unit{color:var(--faint);font-size:12px;margin-left:4px;font-weight:400}
.t .today{background:var(--accent-soft)}
.cell{display:flex;align-items:center;gap:6px}
.cell input{width:64px}
.tgt{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.carry{font-style:normal;font-family:var(--f-sans);font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px}
.ratecell{display:flex;align-items:center;gap:8px;min-width:150px}
.ratecell .bar{flex:1}
.ratecell b{font-family:var(--f-mono);font-size:12.5px;width:44px;text-align:right}

input.in,select.in,textarea.in,.cell input,.t input{height:32px;padding:0 9px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea.in{height:auto;padding:9px 11px;font-family:var(--f-sans);line-height:1.6;resize:vertical;min-height:72px;width:100%;field-sizing:content}
input.in:focus,select.in:focus,textarea.in:focus,.t input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
input:disabled,textarea:disabled,select:disabled{background:var(--sunk);cursor:not-allowed}
input.txt{font-family:var(--f-sans)}

/* todos */
.todo-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.todo-col h3{margin:0 0 2px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.todo-col h3 small{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:12px}
.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 6px;border-radius:6px}
.todo:hover{background:var(--sunk)}
.todo input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent)}
.todo .tt{min-width:0;overflow-wrap:anywhere}
.todo.done .tt span.txt{color:var(--faint);text-decoration:line-through}
.todo .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.badge.carry{background:var(--warn-soft);color:var(--warn)}
.badge.moved{background:var(--sunk);color:var(--faint)}
.todo .x{opacity:0;border:0;background:none;color:var(--faint);width:22px;height:22px;border-radius:4px}
.todo:hover .x,.todo .x:focus-visible{opacity:1}
.todo .x:hover{color:var(--bad);background:var(--bad-soft)}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0}
.empty{padding:14px;border:1px dashed var(--line-strong);border-radius:6px;color:var(--muted);font-size:13px;text-align:center}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:600}
.cal-d{aspect-ratio:1/0.82;max-width:100%;border:0;border-radius:6px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;background:var(--heat0);color:var(--ink)}
.cal-d span{font-size:12px;font-weight:600}
.cal-d b{font-family:var(--f-mono);font-size:11px;font-weight:500}
.cal-d.h1{background:var(--heat1)} .cal-d.h2{background:var(--heat2)} .cal-d.h3{background:var(--heat3);color:var(--heat-hi)} .cal-d.h4{background:var(--heat4);color:var(--heat-hi)}
.cal-d.off{opacity:.55}
.cal-d.is-today{outline:2px solid var(--ink);outline-offset:-2px}
.cal-d:hover{filter:brightness(.96)}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .bx{fill:var(--accent)}
.chart .bx.fut{fill:var(--line)}
.chart .tl{stroke:var(--dh);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.chart .tlab{fill:var(--dh);font-size:10.5px;font-weight:600;font-family:var(--f-sans)}

/* lists */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
.rows li:last-child{border-bottom:0}
.rows .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows time{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.rows button.lnk{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-weight:500}
.rows button.lnk:hover{color:var(--accent);text-decoration:underline}
.due-late{color:var(--bad)!important}

/* meetings */
.mgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px}
.mlist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 220px);overflow:auto}
.mitem{width:100%;border:1px solid transparent;background:none;border-radius:6px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mitem:hover{background:var(--surface);border-color:var(--line)}
.mitem[aria-current="true"]{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.mitem .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mitem time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mitem b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .l3{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.medit{display:flex;flex-direction:column;gap:18px}
.mhead{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
.mhead input.title{font-family:var(--f-sans);font-size:18px;font-weight:600;height:40px;width:100%}
.mhead input[type=date]{height:40px;width:100%}
.fld{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fl .by{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:400;font-size:11.5px;color:var(--faint)}
.att{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:500}
.tog[aria-pressed="true"].jaehee{background:var(--jh-soft);border-color:var(--jh);color:var(--jh)}
.tog[aria-pressed="true"].donghee{background:var(--dh-soft);border-color:var(--dh);color:var(--dh)}
.tog[aria-pressed="true"].plain{background:var(--accent-soft);border-color:var(--accent)}
.acts td input.txt{width:100%;min-width:200px}
.acts td select{min-width:72px}
.acts td input[type=date]{width:140px}
.acts tr.done input.txt{text-decoration:line-through;color:var(--faint)}
.cmts{display:flex;flex-direction:column;gap:10px}
.cmt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;background:var(--sunk);border-radius:6px}
.cmt p{grid-column:1/-1;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);align-self:center}
.mfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.confirm{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:var(--bad-soft);font-size:13px}

/* setup */
.klist{display:flex;flex-direction:column;gap:6px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) 80px auto auto auto;gap:8px;align-items:center}
.kadd{margin-top:14px;max-width:560px}
.hidden-k{display:flex;flex-wrap:wrap;gap:8px}
.krow input,.krow select{width:100%}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide li::marker{font-family:var(--f-mono);color:var(--accent)}

/* gate */
.gate-card .btn{height:44px;font-size:15px}
.gate-card code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:2px 6px;border-radius:4px}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,16,14,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal-card{background:var(--surface);border-radius:12px;padding:28px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.modal-card h2{margin:0;font-size:20px}
.modal-card p{margin:0;color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{height:72px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:700}
.pick button.jaehee:hover{border-color:var(--jh);background:var(--jh-soft);color:var(--jh)}
.pick button.donghee:hover{border-color:var(--dh);background:var(--dh-soft);color:var(--dh)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(380px,calc(100vw - 40px));padding:12px 14px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:13px;box-shadow:var(--shadow)}

@media (max-width:1100px){ .sum{grid-template-columns:repeat(3,minmax(0,1fr))} .sum>div{border-top:1px solid var(--line)} .sum>div:nth-child(-n+3){border-top:0} .sum>div:nth-child(4){border-left:0} }
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  .nav button{width:auto;white-space:nowrap} .nav button small{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .who{padding:6px 8px} .sync{display:none}
  .cols,.mgrid{grid-template-columns:minmax(0,1fr)}
  .cols3{grid-template-columns:minmax(0,1fr)}
  .mlist{position:static} .mlist ul{max-height:260px}
}
@media (max-width:560px){ .sum{grid-template-columns:repeat(2,minmax(0,1fr))} .sum>div{border-left:0;border-top:1px solid var(--line)} .sum>div:first-child{grid-column:1/-1;border-top:0} .mhead{grid-template-columns:minmax(0,1fr)} .krow{grid-template-columns:minmax(0,1fr) 72px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>재희·동희 회의록</b><span>회의 · 목표 · 달성률</span></div>
    <nav class="nav" id="nav" aria-label="메뉴">
      <button data-go="home">대시보드</button>
      <button data-go="notes">회의록</button>
      <button data-go="day">일간 <small>DAY</small></button>
      <button data-go="week">주간 <small>WEEK</small></button>
      <button data-go="month">월간 <small>MONTH</small></button>
      <button data-go="setup">설정</button>
    </nav>
    <div class="side-foot">

      <div class="sync" id="sync"><i></i><span>연결 중…</span></div>
    </div>
  </aside>
  <main class="main"><div class="main-in" id="view"></div></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ==========================================================
   ① Firebase 설정 — 안내서 4단계에서 복사한 값으로 바꿔 넣으세요
   ========================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAbJ-CPO-847gy0-CgXYHcpCdAqXK_4sOM",
  authDomain: "cha-meeting-log.firebaseapp.com",
  projectId: "cha-meeting-log",
  storageBucket: "cha-meeting-log.firebasestorage.app",
  messagingSenderId: "892492257899",
  appId: "1:892492257899:web:8aa75b58c9a95e274aef2e"
};
/* ==========================================================
   ② 접속 허용 이메일 — 바꿀 땐 firestore.rules 도 똑같이 바꾸세요
   ========================================================== */
const ALLOWED = {
  "pjs870496@gmail.com": "donghee",
  "d2207@e-mirim.hs.kr": "jaehee"
};

/* ---------- constants & date helpers ---------- */
const NAMES={jaehee:'재희',donghee:'동희',team:'공동'};
const PEOPLE=['jaehee','donghee'];
const CATS=[['sales','영업'],['content','콘텐츠'],['etc','기타']];
const DOW=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const today=()=>fmt(new Date());
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)};
const mkOf=s=>s.slice(0,7);
const monthDates=mk=>{const[y,m]=mk.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${mk}-${pad(i+1)}`)};
const weekDates=mon=>Array.from({length:7},(_,i)=>addDays(mon,i));
const addMonths=(mk,n)=>{const[y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const dow=s=>parse(s).getDay();
const pk=(s,scope)=>scope==='D'?s:scope==='W'?mondayOf(s):mkOf(s);
const dLabel=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`};
const dShort=s=>{const d=parse(s);return `${d.getMonth()+1}.${d.getDate()}`};
const mLabel=mk=>{const[y,m]=mk.split('-').map(Number);return `${y}년 ${m}월`};
const weekNo=mon=>{ // n주차 of the month containing Thursday of the week
  const th=addDays(mon,3);const first=mondayOf(mkOf(th)+'-01');let f=first;if(mkOf(addDays(first,3))!==mkOf(th))f=addDays(first,7);
  return {mk:mkOf(th),n:Math.round((parse(mon)-parse(f))/864e5/7)+1}};
const wLabel=mon=>{const w=weekNo(mon);const m=+w.mk.slice(5);return `${m}월 ${w.n}주차`};
const fmtTime=ts=>{if(!ts)return '';const d=new Date(ts);return `${d.getMonth()+1}.${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};

/* ---------- state ---------- */
const S={db:null,user:null,uid:null,who:null,readOnly:false,offline:false,live:false,
  view:'home',day:today(),week:mondayOf(today()),month:mkOf(today()),
  sel:null,search:'',trendKpi:null,confirmDel:null,downloads:null,
  kpis:[],targets:{},actuals:{},todos:[],meetings:[],members:{},config:{workdays:[1,2,3,4,5]},got:{}};
const isWork=s=>(S.config.workdays||[1,2,3,4,5]).includes(dow(s));
const clone=o=>JSON.parse(JSON.stringify(o||{}));

/* ---------- formatting ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'–':(Math.round(v*10)/10).toLocaleString('ko-KR',{maximumFractionDigits:1});
const pct=r=>r==null?'–':Math.round(r*100)+'%';
const tone=r=>r==null?'none':r>=1?'good':r>=0.7?'ok':r>=0.4?'warn':'bad';
const bar=r=>`<span class="bar t-${tone(r)}"><i style="width:${r==null?0:Math.min(100,Math.round(r*100))}%"></i></span>`;
const chip=w=>`<span class="chip c-${esc(w)}">${NAMES[w]||'?'}</span>`;
const avg=(...a)=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const RO=()=>S.readOnly||S.offline?'disabled':'';
const rateCell=(a,t)=>{const r=t>0?a/t:null;return `<div class="ratecell">${bar(r)}<b class="tx-${tone(r)}">${pct(r)}</b></div>`};

/* ---------- KPI math ---------- */
const activeKpis=()=>S.kpis.filter(k=>k.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));
const nv=v=>typeof v==='number'&&isFinite(v)?v:null;
function mTarget(mk,kid,who){
  const t=S.targets[mk]?.kpi?.[kid];if(!t)return null;
  if(who==='team'){const tt=nv(t.team);if(tt!=null)return tt;const a=nv(t.jaehee),b=nv(t.donghee);return a==null&&b==null?null:(a||0)+(b||0)}
  return nv(t[who]);
}
function act(date,kid,who){const v=S.actuals[date]?.v?.[kid];if(!v)return 0;const n=x=>nv(x)||0;return who==='team'?n(v.jaehee)+n(v.donghee):n(v[who])}
const sumAct=(dates,kid,who)=>dates.reduce((s,d)=>s+act(d,kid,who),0);
function wTarget(mon,kid,who){ // remaining month target redistributed over remaining workdays (shortfall carries forward)
  const wd=weekDates(mon);let total=null;
  for(const mk of [...new Set(wd.map(mkOf))]){
    const T=mTarget(mk,kid,who);if(T==null)continue;const md=monthDates(mk);
    const rem=Math.max(0,T-sumAct(md.filter(d=>d<mon),kid,who));
    const remW=md.filter(d=>d>=mon&&isWork(d)).length;const inW=wd.filter(d=>mkOf(d)===mk&&isWork(d)).length;
    total=(total||0)+(remW?rem*inW/remW:0);
  }
  return total;
}
function dTarget(date,kid,who){
  const mon=mondayOf(date);const wt=wTarget(mon,kid,who);if(wt==null)return null;if(!isWork(date))return 0;
  const wd=weekDates(mon);const rem=Math.max(0,wt-sumAct(wd.filter(d=>d<date),kid,who));
  const remW=wd.filter(d=>d>=date&&isWork(d)).length;return remW?rem/remW:0;
}
function baseDay(date,kid,who){const T=mTarget(mkOf(date),kid,who);if(T==null)return null;const n=monthDates(mkOf(date)).filter(isWork).length;return n?T/n:0}
function baseWeek(mon,kid,who){let s=null;for(const d of weekDates(mon)){if(!isWork(d))continue;const b=baseDay(d,kid,who);if(b!=null)s=(s||0)+b}return s}
function period(scope,key){
  if(scope==='D')return{dates:[key],tgt:(k,w)=>dTarget(key,k,w)};
  if(scope==='W')return{dates:weekDates(key),tgt:(k,w)=>wTarget(key,k,w)};
  return{dates:monthDates(key),tgt:(k,w)=>mTarget(key,k,w)};
}
function kpiRate(scope,key,who){
  const P=period(scope,key);const rs=[];
  for(const k of activeKpis()){const t=P.tgt(k.id,who);if(t>0)rs.push(Math.min(1,sumAct(P.dates,k.id,who)/t))}
  return rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;
}

/* ---------- todos with carry-over ---------- */
function todosFor(scope,key,owner){
  return S.todos.filter(t=>t.scope===scope&&(!owner||t.owner===owner)&&t.key<=key&&(t.key===key||!(t.done&&pk(t.doneDate||t.key,scope)<key)))
    .map(t=>{const dk=t.done?pk(t.doneDate||t.key,scope):null;return{...t,carried:t.key<key,achieved:!!(t.done&&dk<=key),moved:(t.done&&dk>key)||(!t.done&&key<pk(today(),scope))}})
    .sort((a,b)=>(a.achieved-b.achieved)||(a.createdAt||0)-(b.createdAt||0));
}
function todoRate(scope,key,owner){const l=todosFor(scope,key,owner);return l.length?l.filter(t=>t.achieved).length/l.length:null}
function overall(scope,key,who){ // who: 'team' => team KPI + all todos
  return who==='team'?avg(kpiRate(scope,key,'team'),todoRate(scope,key)):avg(kpiRate(scope,key,who),todoRate(scope,key,who));
}

/* ---------- writes ---------- */
const queues={};
function enqueue(path,fn){queues[path]=(queues[path]||Promise.resolve()).then(fn).catch(onErr);return queues[path]}
function onErr(e){
  console.error(e);const c=e&&e.code;
  if(c==='permission-denied')toast('저장 권한이 없어요. 허용된 구글 계정으로 로그인했는지, 데이터베이스 규칙을 게시했는지 확인해 주세요.');
  else if(c==='resource-exhausted')toast('오늘 무료 사용량을 넘었어요. 내일 다시 시도해 주세요.');
  else if(c==='unauthenticated'){toast('로그인이 풀렸어요. 다시 로그인해 주세요.')}
  else toast('잠시 저장이 안 됐어요. 인터넷 연결을 확인해 주세요.');
}
function canWrite(){if(!S.db||!S.who){toast('로그인한 뒤에 수정할 수 있어요.');return false}return true}
function setActual(date,kid,who,val){
  if(!canWrite())return;const exists=!!S.actuals[date];
  const d=S.actuals[date]||(S.actuals[date]={date,v:{}});d.v=d.v||{};d.v[kid]=d.v[kid]||{};d.v[kid][who]=val;
  void exists;const patch={date,v:{[kid]:{[who]:val}},by:{[kid]:S.who},at:Date.now()};
  enqueue('actuals/'+date,()=>S.db.doc('actuals/'+date).set(patch,{merge:true}));
  soon();
}
function setTarget(mk,kid,who,val){
  if(!canWrite())return;const exists=!!S.targets[mk];
  const d=S.targets[mk]||(S.targets[mk]={kpi:{}});d.kpi=d.kpi||{};d.kpi[kid]=d.kpi[kid]||{};d.kpi[kid][who]=val;
  void exists;enqueue('targets/'+mk,()=>S.db.doc('targets/'+mk).set({kpi:{[kid]:{[who]:val}},by:S.who,at:Date.now()},{merge:true}));
  soon();
}
async function addTodo(scope,key,owner,text){
  if(!canWrite()||!text.trim())return;
  const doc={scope,key,owner,text:text.trim(),done:false,doneDate:null,createdBy:S.who,createdAt:Date.now()};
  const ref=S.db.collection('todos').doc();S.todos.push({id:ref.id,...doc});render();
  enqueue('todos/'+ref.id,()=>ref.set(doc));
}
function toggleTodo(id,scope,key,checked){
  if(!canWrite())return;const t=S.todos.find(x=>x.id===id);if(!t)return;
  let dd=null;
  if(checked){const td=today();dd=scope==='D'?key:pk(td,scope)===key?td:(scope==='W'?key:key+'-01')}
  t.done=checked;t.doneDate=dd;t.doneBy=checked?S.who:null;render();
  enqueue('todos/'+id,()=>S.db.doc('todos/'+id).update({done:checked,doneDate:dd,doneBy:checked?S.who:null}));
}
function delTodo(id){if(!canWrite())return;S.todos=S.todos.filter(t=>t.id!==id);render();enqueue('todos/'+id,()=>S.db.doc('todos/'+id).delete())}

const mTimers={};
function saveMeetingField(id,field,val,now){
  const m=S.meetings.find(x=>x.id===id);if(!m)return;
  if(!S.db||!S.who)return canWrite();
  m[field]=val;m.fieldBy=m.fieldBy||{};m.fieldBy[field]=S.who;m.updatedBy=S.who;m.updatedAt=Date.now();
  const key=id+field;clearTimeout(mTimers[key]);
  const go=()=>enqueue('meetings/'+id,()=>S.db.doc('meetings/'+id).update({[field]:val,['fieldBy.'+field]:S.who,updatedBy:S.who,updatedAt:Date.now()}));
  if(now)go();else mTimers[key]=setTimeout(go,800);
}
function saveMeetingWhole(id,patch){
  if(!canWrite())return;const m=S.meetings.find(x=>x.id===id);if(!m)return;
  Object.assign(m,patch,{updatedBy:S.who,updatedAt:Date.now()});soon();
  enqueue('meetings/'+id,()=>S.db.doc('meetings/'+id).update({...clone(patch),updatedBy:S.who,updatedAt:Date.now()}));
}
function newMeeting(){
  if(!canWrite())return;
  const prev=sortedMeetings()[0];
  const doc={date:today(),title:'',attendees:['jaehee','donghee'],agenda:prev&&prev.next?prev.next:'',discussion:'',decisions:'',actions:[],next:'',comments:[],
    fieldBy:prev&&prev.next?{agenda:prev.fieldBy?.next||S.who}:{},createdBy:S.who,createdAt:Date.now(),updatedBy:S.who,updatedAt:Date.now()};
  const ref=S.db.collection('meetings').doc();S.meetings.push({id:ref.id,...doc});S.sel=ref.id;S.search='';
  enqueue('meetings/'+ref.id,()=>ref.set(doc));render();
  setTimeout(()=>document.getElementById('m-title')?.focus(),30);
}
const uid4=()=>Math.random().toString(36).slice(2,10);
function addKpi(p){
  if(!canWrite())return;const ni=document.getElementById('nk-name-'+p),ui=document.getElementById('nk-unit-'+p);
  const n=(ni?.value||'').trim(),unit=(ui?.value||'').trim();if(!n){toast('지표 이름을 적어 주세요.');ni?.focus();return}
  if(activeKpis().some(k=>k.name===n)){toast(`'${n}' 지표가 이미 있어요.`);return}
  const order=Math.max(0,...activeKpis().map(k=>k.order||0))+1;const ref=S.db.collection('kpis').doc();const doc={name:n,cat:'etc',unit,order,active:true,createdBy:S.who};
  S.kpis.push({id:ref.id,...doc});ni.value='';enqueue('kpis/'+ref.id,()=>ref.set(doc));render();
  document.getElementById('nk-name-'+p)?.focus();toast(`'${n}' 지표를 추가했어요.`);
}

/* ---------- toast & identity ---------- */
let tT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3800)}
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function gate(kind,email){
  const el=document.getElementById('modal');
  if(!kind){el.innerHTML='';return}
  const body=kind==='login'?`<h2 id="g-h">재희·동희 회의록</h2><p>허용된 구글 계정으로 로그인해 주세요.</p><button class="btn primary" data-do="login">구글 계정으로 로그인</button>`
    :kind==='denied'?`<h2 id="g-h">접속할 수 없는 계정이에요</h2><p><code>${esc(email)}</code> 계정은 허용 목록에 없어요. 재희 또는 동희의 구글 계정으로 다시 로그인해 주세요.</p><button class="btn primary" data-do="logout">다른 계정으로 로그인</button>`
    :kind==='config'?`<h2 id="g-h">설정이 아직 안 됐어요</h2><p><code>index.html</code> 맨 위의 FIREBASE_CONFIG 값을 Firebase에서 복사한 값으로 바꿔 주세요. 설정 안내서 4단계를 참고하세요.</p>`
    :`<h2 id="g-h">연결 중…</h2><p>잠시만 기다려 주세요.</p>`;
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="g-h"><div class="modal-card gate-card">${body}</div></div>`;
}
async function login(){
  const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(prov)}
  catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){firebase.auth().signInWithRedirect(prov)}
    else if(e.code==='auth/unauthorized-domain')toast('이 주소가 Firebase 승인된 도메인에 없어요. 안내서 6단계를 확인해 주세요.');
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('로그인하지 못했어요: '+(e.code||'알 수 없는 오류'))}
}


/* ---------- shared view pieces ---------- */
function summary(scope,key){
  const k=kpiRate(scope,key,'team'),l=todosFor(scope,key),done=l.filter(t=>t.achieved).length,all=overall(scope,key,'team');
  return `<div class="sum">
    <div><span class="lbl">종합 달성률</span><b class="big tx-${tone(all)}">${pct(all)}</b><span class="lbl">KPI와 할 일 평균</span></div>
    <div><span class="lbl">KPI · 공동</span><b>${pct(k)}</b>${bar(k)}</div>
    <div><span class="lbl">할 일 완료</span><b>${done}/${l.length}</b>${bar(l.length?done/l.length:null)}</div>
    ${PEOPLE.map(p=>{const r=overall(scope,key,p);return `<div><span class="lbl">${chip(p)} 개인 종합</span><b>${pct(r)}</b>${bar(r)}</div>`}).join('')}
  </div>`;
}
function pnav(kind,label,sub){
  return `<div class="head"><div><h1>${label}</h1>${sub?`<p>${sub}</p>`:''}</div>
    <div class="pnav"><button class="btn icon" data-do="prev" data-k="${kind}" aria-label="이전">‹</button>
    <button class="btn" data-do="now" data-k="${kind}">${kind==='day'?'오늘':kind==='week'?'이번 주':'이번 달'}</button>
    <button class="btn icon" data-do="next" data-k="${kind}" aria-label="다음">›</button></div></div>`;
}
function todoBoard(scope,key,title){
  const kind=scope==='D'?'day':scope==='W'?'week':'month';
  const col=o=>{const l=todosFor(scope,key,o);const d=l.filter(t=>t.achieved).length;
    return `<div class="todo-col"><h3>${chip(o)}<small>${d}/${l.length}</small></h3>
      ${l.length?`<ul class="todos">${l.map(t=>todoItem(t,scope,key)).join('')}</ul>`:`<div class="empty">아직 할 일이 없어요</div>`}
      <div class="addrow"><input class="in txt" id="add-${scope}-${o}" placeholder="할 일 추가 후 Enter" data-add="${scope}" data-owner="${o}" data-key="${key}" ${RO()}>
      <button class="btn sm" data-do="addtodo" data-scope="${scope}" data-owner="${o}" data-key="${key}" ${RO()}>추가</button></div></div>`};
  return `<section class="panel"><div class="panel-h"><div><h2>${title}</h2><p>못 끝낸 할 일은 다음 ${kind==='day'?'날':kind==='week'?'주':'달'}로 자동 이월돼요.</p></div></div>
    <div class="cols3">${['team','jaehee','donghee'].map(col).join('')}</div></section>`;
}
function todoItem(t,scope,key){
  const from=t.carried?`<span class="badge carry">↪ ${scope==='D'?dShort(t.key):scope==='W'?wLabel(t.key):(+t.key.slice(5))+'월'}에서 이월</span>`:'';
  const moved=!t.achieved&&t.moved?`<span class="badge moved">다음으로 이월</span>`:'';
  return `<li class="todo ${t.achieved?'done':''}"><input type="checkbox" id="td-${t.id}" data-todo="${t.id}" data-scope="${scope}" data-key="${key}" ${t.achieved?'checked':''} ${RO()} aria-label="완료">
    <label class="tt" for="td-${t.id}"><span class="txt">${esc(t.text)}</span><span class="meta">${from}${moved}${t.createdBy?`<span class="badge">작성 ${NAMES[t.createdBy]||''}</span>`:''}${t.achieved&&t.doneBy?`<span class="badge">완료 ${NAMES[t.doneBy]||''}</span>`:''}</span></label>
    <button class="x" data-do="deltodo" data-id="${t.id}" aria-label="삭제" ${RO()}>×</button></li>`;
}
function noKpi(){return `<div class="empty">아직 지표가 없어요. 아래에서 첫 지표를 추가해 보세요.</div>`}
function groupRows(cols,rowFn){return activeKpis().map(rowFn).join('')}
function delCell(k){
  return S.confirmKpi===k.id?`<td><span class="confirm">'${esc(k.name)}' 지표를 삭제할까요? <button class="btn sm danger" data-do="delkpi" data-kid="${k.id}">삭제</button><button class="btn sm" data-do="nokpi">취소</button></span></td>`
    :`<td class="r"><button class="btn sm ghost" data-do="askdelkpi" data-kid="${k.id}" aria-label="${esc(k.name)} 지표 삭제" ${RO()}>삭제</button></td>`;
}
function kpiAdder(p){
  return `<div class="addrow kadd"><input class="in txt" id="nk-name-${p}" data-nk="${p}" placeholder="새 지표 이름 (예: 유튜브 쇼츠)" aria-label="새 지표 이름" ${RO()}>
    <input class="in txt" id="nk-unit-${p}" data-nk="${p}" value="개" aria-label="단위" style="width:72px;flex:none" ${RO()}>
    <button class="btn sm primary" data-do="addkpi" data-p="${p}" ${RO()}>＋ 지표 추가</button></div>`;
}
const kName=k=>`<span class="kname">${esc(k.name)}</span><span class="unit">${esc(k.unit||'')}</span>`;
function heat(r){return r==null?0:r<.25?1:r<.5?2:r<.85?3:4}
function calendar(mk){
  const ds=monthDates(mk),lead=(dow(ds[0])+6)%7,td=today();
  let h=['월','화','수','목','금','토','일'].map(d=>`<div class="dh">${d}</div>`).join('')+'<div></div>'.repeat(lead);
  for(const d of ds){const r=d<=td?overall('D',d,'team'):null;
    h+=`<button class="cal-d h${heat(r)} ${isWork(d)?'':'off'} ${d===td?'is-today':''}" data-do="goday" data-date="${d}" aria-label="${dLabel(d)} ${pct(r)}"><span>${+d.slice(8)}</span><b>${r==null?'':pct(r)}</b></button>`}
  return `<div class="cal">${h}</div><div class="legend" style="margin-top:10px">낮음 ${[0,1,2,3,4].map(i=>`<i style="background:var(--heat${i})"></i>`).join('')} 높음 · 날짜를 누르면 그날로 이동</div>`;
}
function trend(mk){
  const ks=activeKpis();if(!ks.length)return noKpi();
  let kid=S.trendKpi;if(!ks.find(k=>k.id===kid))kid=ks[0].id;const k=ks.find(x=>x.id===kid);
  const ds=monthDates(mk),td=today(),vals=ds.map(d=>sumAct([d],kid,'team')),base=baseDay(ds[0],kid,'team');
  const W=640,H=210,L=34,R=10,T=14,B=24,iw=W-L-R,ih=H-T-B;
  const mx0=Math.max(1,...vals,base||0);const step=mx0<=5?1:mx0<=10?2:mx0<=25?5:mx0<=50?10:Math.pow(10,Math.floor(Math.log10(mx0)));const mx=Math.ceil(mx0/step)*step;
  const y=v=>T+ih-(v/mx)*ih,bw=iw/ds.length;
  let g='';for(let v=0;v<=mx+1e-9;v+=step){if(mx/step>6&&(v/step)%2)continue;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`}
  let bars='';ds.forEach((d,i)=>{const v=vals[i];const x=L+i*bw+bw*.18,w=bw*.64;if(v>0)bars+=`<rect class="bx ${d>td?'fut':''}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(T+ih-y(v)).toFixed(1)}" rx="2"><title>${dShort(d)}: ${num(v)}${esc(k.unit||'')}</title></rect>`;
    const dn=+d.slice(8);if(dn===1||dn%5===0)bars+=`<text class="ax" x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${dn}</text>`});
  const tl=base!=null&&base>0?`<line class="tl" x1="${L}" x2="${W-R}" y1="${y(base)}" y2="${y(base)}"/><text class="tlab" x="${W-R}" y="${y(base)-5}" text-anchor="end">하루 기준 목표 ${num(base)}</text>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(k.name)} 일별 공동 실적">${g}${bars}${tl}</svg></div>`;
}

/* ---------- render ---------- */
let pending=false,ptrDown=false;
const editing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#view')&&a.matches('textarea,input:not([type=number]):not([type=checkbox]):not([type=date])'))};
const soon=()=>setTimeout(schedule,0);
function schedule(){if(editing()||ptrDown){pending=true;return}pending=false;render()}
function render(){
  const a=document.activeElement,aid=a&&a.id;let val=null,ss=null,se=null;
  if(aid&&a.closest&&a.closest('#view')&&'value' in a){val=a.value;try{ss=a.selectionStart;se=a.selectionEnd}catch{}}
  const v=document.getElementById('view');
  let banner='';
  if(S.offline)banner=`<div class="banner">저장소에 연결되지 않았어요. 인터넷 연결과 Firebase 설정을 확인해 주세요.</div>`;
  v.innerHTML=banner+(V[S.view]||V.home)();
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===S.view?'page':'false'));
  const w=document.getElementById('who');
  w.innerHTML=S.who?`<span class="dot c-${S.who}">${NAMES[S.who][0]}</span><div><b>${NAMES[S.who]}</b><small><button class="btn sm ghost" data-do="logout" style="padding:0;height:auto">로그아웃</button></small></div>`:`<span class="dot" style="background:var(--sunk)">?</span><div><b>로그인 필요</b></div>`;
  const s=document.getElementById('sync');s.className='sync '+(S.offline?'off':S.live?'on':'');s.querySelector('span').textContent=S.offline?'연결 안 됨':S.live?'실시간 동기화 중':'연결 중…';
  if(aid){const n=document.getElementById(aid);if(n&&n!==a){if(val!=null&&n.type!=='checkbox')n.value=val;n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch{}}}
}
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
const ptrUp=()=>{ptrDown=false;setTimeout(()=>{if(pending)schedule()},0)};
document.addEventListener('pointerup',ptrUp,true);document.addEventListener('pointercancel',ptrUp,true);window.addEventListener('blur',ptrUp);
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending)schedule()},0));

/* ---------- navigation ---------- */
const VIEWS=['home','notes','day','week','month','setup'];
function go(view){S.view=VIEWS.includes(view)?view:'home';S.confirmDel=null;try{history.replaceState(null,'','#'+S.view)}catch{}render();window.scrollTo({top:0})}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const b=e.target.closest('[data-do]');if(!b)return;const d=b.dataset,act=d.do;
  const m=S.meetings.find(x=>x.id===S.sel);
  switch(act){
    case 'prev':case 'next':case 'now':{const n=act==='prev'?-1:act==='next'?1:0;
      if(d.k==='day')S.day=n?addDays(S.day,n):today();else if(d.k==='week')S.week=n?addDays(S.week,7*n):mondayOf(today());else S.month=n?addMonths(S.month,n):mkOf(today());render();break}
    case 'goday':S.day=d.date;go('day');break;
    case 'goweek':S.week=d.mon;go('week');break;
    case 'addtodo':{const id=`add-${d.scope}-${d.owner}`;const v=document.getElementById(id).value;document.getElementById(id).value='';addTodo(d.scope,d.key,d.owner,v);document.getElementById(id)?.focus();break}
    case 'deltodo':delTodo(d.id);break;
    case 'newmeeting':S.view='notes';try{history.replaceState(null,'','#notes')}catch{}newMeeting();break;
    case 'openm':S.sel=d.id;S.confirmDel=null;if(S.view!=='notes')go('notes');else render();break;
    case 'att':{if(!m)break;const a=new Set(m.attendees||[]);a.has(d.p)?a.delete(d.p):a.add(d.p);saveMeetingWhole(m.id,{attendees:[...a]});break}
    case 'delatt':{if(!m)break;saveMeetingWhole(m.id,{attendees:(m.attendees||[]).filter(x=>x!==d.p)});break}
    case 'addact':{if(!m)break;const id=uid4();saveMeetingWhole(m.id,{actions:[...(m.actions||[]),{id,text:'',owner:'team',due:'',done:false,by:S.who}]});setTimeout(()=>document.getElementById('ma-t-'+id)?.focus(),20);break}
    case 'delact':{if(!m)break;saveMeetingWhole(m.id,{actions:(m.actions||[]).filter(a=>a.id!==d.aid)});break}
    case 'act2todo':{if(!m||!canWrite())break;const a=(m.actions||[]).find(x=>x.id===d.aid);if(!a||!a.text){toast('할 일 내용을 먼저 적어 주세요.');break}
      const key=a.due||today();const ref=S.db.collection('todos').doc();const doc={scope:'D',key,owner:a.owner||'team',text:a.text,done:false,doneDate:null,createdBy:S.who,createdAt:Date.now(),fromMeeting:m.id};
      S.todos.push({id:ref.id,...doc});enqueue('todos/'+ref.id,()=>ref.set(doc));
      saveMeetingWhole(m.id,{actions:(m.actions||[]).map(x=>x.id===a.id?{...x,todoId:ref.id}:x)});toast(`${dLabel(key)} 할 일로 보냈어요.`);break}
    case 'addcmt':{if(!m||!canWrite())break;const t=document.getElementById('m-cmt');const v=t.value.trim();if(!v)break;t.blur();
      saveMeetingWhole(m.id,{comments:[...(m.comments||[]),{id:uid4(),by:S.who,text:v,at:Date.now()}]});setTimeout(()=>{const n=document.getElementById('m-cmt');if(n)n.value=''},5);break}
    case 'delcmt':{if(!m)break;saveMeetingWhole(m.id,{comments:(m.comments||[]).filter(c=>c.id!==d.cid)});break}
    case 'delm':S.confirmDel=S.sel;render();break;
    case 'delm-no':S.confirmDel=null;render();break;
    case 'delm-yes':{if(!m||!canWrite())break;const id=m.id;S.meetings=S.meetings.filter(x=>x.id!==id);S.sel=null;S.confirmDel=null;enqueue('meetings/'+id,()=>S.db.doc('meetings/'+id).delete());render();toast('회의록을 삭제했어요.');break}
    case 'export':if(m)exportMeeting(m);break;
    case 'login':login();break;
    case 'logout':firebase.auth().signOut();break;
    case 'addkpi':addKpi(d.p);break;
    case 'askdelkpi':S.confirmKpi=d.kid;render();break;
    case 'nokpi':S.confirmKpi=null;render();break;
    case 'delkpi':{S.confirmKpi=null;if(!canWrite())break;const k=S.kpis.find(x=>x.id===d.kid);if(k)k.active=false;enqueue('kpis/'+d.kid,()=>S.db.doc('kpis/'+d.kid).update({active:false}));render();toast(`'${k?k.name:''}' 지표를 삭제했어요. 설정에서 복구할 수 있어요.`);break}
    case 'restorekpi':{if(!canWrite())break;const k=S.kpis.find(x=>x.id===d.kid);if(!k)break;k.active=true;k.order=Math.max(0,...activeKpis().filter(x=>x.id!==k.id).map(x=>x.order||0))+1;
      const o=k.order;enqueue('kpis/'+d.kid,()=>S.db.doc('kpis/'+d.kid).update({active:true,order:o}));render();break}
    case 'mvkpi':{if(!canWrite())break;const ks=activeKpis();const i=ks.findIndex(x=>x.id===d.kid),j=i+Number(d.dir);if(i<0||j<0||j>=ks.length)break;
      [ks[i],ks[j]]=[ks[j],ks[i]];ks.forEach((k,n)=>{if(k.order!==n+1){k.order=n+1;const o=n+1;enqueue('kpis/'+k.id,()=>S.db.doc('kpis/'+k.id).update({order:o}))}});render();break}
    case 'wd':{if(!canWrite())break;const s=new Set(S.config.workdays||[1,2,3,4,5]);const n=+d.d;s.has(n)?s.delete(n):s.add(n);if(!s.size){toast('근무 요일은 하루 이상이어야 해요.');break}
      S.config={...S.config,workdays:[...s].sort()};enqueue('config/main',()=>S.db.doc('config/main').set(clone(S.config)));render();break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if('actual' in d||'target' in d){const raw=t.value.trim();const v=raw===''?null:Math.max(0,Number(raw));if(raw!==''&&!isFinite(v)){toast('숫자만 입력할 수 있어요.');return}
    if('actual' in d)setActual(d.date,d.kid,d.who,v);else setTarget(d.mk,d.kid,d.who,v);return}
  if(d.mf){saveMeetingField(S.sel,d.mf,t.value,true);return}
  if(d.mfd){const m=S.meetings.find(x=>x.id===S.sel);if(m&&t.value)saveMeetingWhole(m.id,{date:t.value});return}
  if(d.ma){const m=S.meetings.find(x=>x.id===S.sel);if(!m)return;const val=d.ma==='done'?t.checked:t.value;
    saveMeetingWhole(m.id,{actions:(m.actions||[]).map(a=>a.id===d.aid?{...a,[d.ma]:val}:a)});return}
  if(d.todo){toggleTodo(d.todo,d.scope,d.key,t.checked);return}
  if('trend' in d){S.trendKpi=t.value;render();return}
  if(d.kf){if(!canWrite())return;const k=S.kpis.find(x=>x.id===d.kid);const v=d.kf==='name'?t.value.trim():t.value;if(d.kf==='name'&&!v){toast('지표 이름은 비울 수 없어요.');render();return}
    if(k)k[d.kf]=v;enqueue('kpis/'+d.kid,()=>S.db.doc('kpis/'+d.kid).update({[d.kf]:v}));soon();}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.mf)saveMeetingField(S.sel,d.mf,t.value,false);
  else if('search' in d){S.search=t.value;if(!e.isComposing)render()}
});
document.addEventListener('compositionend',e=>{const t=e.target;if(t.dataset&&'search' in t.dataset){S.search=t.value;render()}});
document.addEventListener('keydown',e=>{
  const t=e.target,d=t.dataset||{};
  if(e.key==='Enter'&&!e.isComposing){
    if(d.nk){e.preventDefault();addKpi(d.nk);return}
    if(d.add){e.preventDefault();addTodo(d.add,d.key,d.owner,t.value);const n=document.getElementById(t.id);if(n){n.value='';n.focus()}return}
    if('guest' in d){e.preventDefault();const v=t.value.trim();const m=S.meetings.find(x=>x.id===S.sel);if(v&&m&&!(m.attendees||[]).includes(v)){saveMeetingWhole(m.id,{attendees:[...(m.attendees||[]),v]});render()}const n=document.getElementById('m-guest');if(n){n.value='';n.focus()}return}
    if(t.matches('input[data-live]')){e.preventDefault();t.blur()}
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==S.view)go(h)});

/* ---------- export ---------- */
async function exportMeeting(m){
  const sec=(t,v)=>v?`<h2>${t}</h2><div>${esc(v).replace(/\n/g,'<br>')}</div>`:'';
  const att=(m.attendees||[]).map(a=>NAMES[a]||a).join(', ');
  const acts=(m.actions||[]).filter(a=>a.text);
  const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>회의록 ${esc(m.date)} ${esc(m.title||'')}</title><style>body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:740px;margin:40px auto;padding:0 24px;color:#111;line-height:1.65;font-size:14px}h1{font-size:22px;margin:0 0 6px}h2{font-size:15px;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid #bbb}.meta{color:#555;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#f2f2f2}@media print{body{margin:0 auto}}</style></head><body>
<h1>${esc(m.title||'회의록')}</h1><div class="meta">${esc(m.date?dLabel(m.date):'')} · 참석: ${esc(att)} · 마지막 수정: ${esc(NAMES[m.updatedBy]||'')} ${esc(fmtTime(m.updatedAt))}</div>
${sec('안건',m.agenda)}${sec('논의 내용',m.discussion)}${sec('결정 사항',m.decisions)}
${acts.length?`<h2>할 일</h2><table><tr><th>상태</th><th>내용</th><th>담당</th><th>기한</th></tr>${acts.map(a=>`<tr><td>${a.done?'완료':'진행'}</td><td>${esc(a.text)}</td><td>${esc(NAMES[a.owner]||'')}</td><td>${esc(a.due||'-')}</td></tr>`).join('')}</table>`:''}
${sec('다음 회의 안건',m.next)}
${(m.comments||[]).length?`<h2>코멘트</h2>${m.comments.map(c=>`<p><b>${esc(NAMES[c.by]||'')}</b> <span class="meta">${esc(fmtTime(c.at))}</span><br>${esc(c.text).replace(/\n/g,'<br>')}</p>`).join('')}`:''}
<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`;
  const w=window.open('','_blank');if(!w){toast('팝업이 막혀 있어요. 브라우저 주소창 옆에서 팝업을 허용해 주세요.');return}
  w.document.open();w.document.write(html);w.document.close();
}

/* ---------- boot ---------- */
const DEFAULT_KPIS=[['인스타 게시물',1],['블로그 작성',2]];
let unsubs=[];
(function init(){
  const h=location.hash.slice(1);if(VIEWS.includes(h))S.view=h;
  render();
  if(!window.firebase||String(FIREBASE_CONFIG.apiKey).includes('여기에')){S.offline=true;render();gate('config');return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  gate('wait');
  firebase.auth().onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];S.db=null;S.who=null;S.email=null;S.live=false;
    if(!u){gate('login');render();return}
    const email=(u.email||'').toLowerCase();S.email=email;
    const who=ALLOWED[email];
    if(!who){gate('denied',email);render();return}
    S.who=who;S.db=db;S.offline=false;gate(null);
    const sub=(path,fn)=>unsubs.push(db.collection(path).onSnapshot(s=>{fn(s);S.got[path]=true;S.live=true;schedule()},e=>{onErr(e);S.offline=true;render()}));
    const list=s=>s.docs.map(d=>({id:d.id,...clone(d.data())}));
    const map=s=>{const o={};s.docs.forEach(d=>o[d.id]=clone(d.data()));return o};
    sub('kpis',s=>{S.kpis=list(s)});
    sub('targets',s=>{S.targets=map(s)});
    sub('actuals',s=>{S.actuals=map(s)});
    sub('todos',s=>{S.todos=list(s)});
    sub('meetings',s=>{S.meetings=list(s)});
    let seeded=false;
    unsubs.push(db.doc('config/main').onSnapshot(s=>{
      if(s.exists)S.config={workdays:[1,2,3,4,5],...clone(s.data())};
      else if(!seeded&&!s.metadata.fromCache){seeded=true;const b=db.batch();b.set(db.doc('config/main'),{workdays:[1,2,3,4,5],seeded:true});
        DEFAULT_KPIS.forEach(([n,o])=>b.set(db.collection('kpis').doc(),{name:n,cat:'content',unit:'개',order:o,active:true}));b.commit().catch(onErr)}
      schedule()},onErr));
    render();
  });
  firebase.auth().getRedirectResult().catch(e=>{if(e&&e.code==='auth/unauthorized-domain')toast('이 주소가 Firebase 승인된 도메인에 없어요. 안내서 6단계를 확인해 주세요.')});
})();
</script>
</body>
</html>
